name: Release

# Build self-contained standalone builds for Windows, Linux, and macOS.
# On a version tag push, all builds are attached to a single GitHub Release.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Runs on manual dispatch too (produces downloadable build artifacts only).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   name: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64, name: linux-x64 }
          - { os: macos-latest,   rid: osx-arm64, name: osx-arm64 }
          - { os: macos-13,       rid: osx-x64,   name: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DlmsSimulatorGui/frontend/package-lock.json

      - name: Build web UI
        working-directory: DlmsSimulatorGui/frontend
        run: |
          npm ci
          npm run build

      - name: Publish simulator (${{ matrix.rid }})
        working-directory: DlmsSimulatorGui/backend
        shell: bash
        run: >
          dotnet publish DlmsSimulatorGui.Api.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:GeneratePackageOnBuild=false
          -o "$GITHUB_WORKSPACE/dist/${{ matrix.name }}"

      - name: Publish DlmsProbe test client (${{ matrix.rid }})
        working-directory: DlmsSimulatorGui/tools/DlmsProbe
        shell: bash
        run: >
          dotnet publish DlmsProbe.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:GeneratePackageOnBuild=false
          -o "$GITHUB_WORKSPACE/dist/${{ matrix.name }}/tools"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "DlmsSimulatorGui/packaging/win-x64/*" "dist/${{ matrix.name }}/" -Force
          Remove-Item "dist/${{ matrix.name }}/*.pdb","dist/${{ matrix.name }}/tools/*.pdb","dist/${{ matrix.name }}/web.config" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/${{ matrix.name }}/*" -DestinationPath "DlmsSimulator-${{ matrix.name }}.zip" -CompressionLevel Optimal

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp DlmsSimulatorGui/packaging/unix/* "dist/${{ matrix.name }}/"
          rm -f "dist/${{ matrix.name }}"/*.pdb "dist/${{ matrix.name }}"/tools/*.pdb "dist/${{ matrix.name }}/web.config" || true
          chmod +x "dist/${{ matrix.name }}/DlmsSimulatorGui.Api" "dist/${{ matrix.name }}/start-dlms-simulator.sh" "dist/${{ matrix.name }}/tools/DlmsProbe" || true
          tar -C dist -czf "DlmsSimulator-${{ matrix.name }}.tar.gz" "${{ matrix.name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DlmsSimulator-${{ matrix.name }}
          path: |
            DlmsSimulator-${{ matrix.name }}.zip
            DlmsSimulator-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
