name: Release

# Build self-contained standalone builds for Windows, Linux, and macOS.
# All four targets are cross-compiled on Linux runners (dotnet can publish any
# RID from any host), which avoids the slow/queued macOS + Windows hosted
# runners. On a version tag push, every build is attached to one GitHub Release.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Runs on manual dispatch too (produces downloadable build artifacts only).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   name: win-x64,   kind: windows }
          - { rid: linux-x64, name: linux-x64, kind: unix }
          - { rid: osx-arm64, name: osx-arm64, kind: unix }
          - { rid: osx-x64,   name: osx-x64,   kind: unix }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DlmsSimulatorGui/frontend/package-lock.json

      - name: Build web UI
        working-directory: DlmsSimulatorGui/frontend
        run: |
          npm ci
          npm run build

      - name: Publish simulator + probe (${{ matrix.rid }})
        run: |
          set -e
          DEST="$GITHUB_WORKSPACE/dist/${{ matrix.name }}"
          COMMON="-c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:GeneratePackageOnBuild=false"
          dotnet publish DlmsSimulatorGui/backend/DlmsSimulatorGui.Api.csproj $COMMON -o "$DEST"
          dotnet publish DlmsSimulatorGui/tools/DlmsProbe/DlmsProbe.csproj  $COMMON -o "$DEST/tools"

      - name: Package
        run: |
          set -e
          DEST="dist/${{ matrix.name }}"
          rm -f "$DEST"/*.pdb "$DEST"/tools/*.pdb "$DEST/web.config" || true
          if [ "${{ matrix.kind }}" = "windows" ]; then
            cp DlmsSimulatorGui/packaging/win-x64/* "$DEST/"
            ( cd "$DEST" && zip -r -q "$GITHUB_WORKSPACE/DlmsSimulator-${{ matrix.name }}.zip" . )
          else
            cp DlmsSimulatorGui/packaging/unix/* "$DEST/"
            chmod +x "$DEST/DlmsSimulatorGui.Api" "$DEST/start-dlms-simulator.sh" "$DEST/tools/DlmsProbe" || true
            tar -C dist -czf "DlmsSimulator-${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DlmsSimulator-${{ matrix.name }}
          path: |
            DlmsSimulator-${{ matrix.name }}.zip
            DlmsSimulator-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
